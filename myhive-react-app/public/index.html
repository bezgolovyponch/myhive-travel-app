    <meta property="og:title" content="Trivlu — Group Travel Made Easy"/>
    <meta property="og:description"
          content="Turn group travel chaos into epic adventures with zero stress. Trivlu is the first AI trip maker for multi-traveler experiences."/>
    <meta property="og:type" content="website"/>
    <!-- Absolute www URLs: trivlu.com 301-redirects to www.trivlu.com and several
         link scrapers (WhatsApp, Telegram) refuse redirected og:image URLs, falling
         back to whatever preview they cached long ago. -->
    <meta property="og:url" content="https://www.trivlu.com"/>
    <meta property="og:image" content="https://www.trivlu.com/logo512.png"/>
    <meta property="og:image:width" content="512"/>
    <meta property="og:image:height" content="512"/>
    <meta property="og:image:type" content="image/png"/>

    Notice the use of %PUBLIC_URL% in the tags above.

    Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

  -->
