# DB_CLOSE_DELAY=-1 keeps the in-memory database alive for the whole JVM, as the
# dev profile does: H2 discards a mem database the moment its last connection
# closes, which would take the schema of every still-cached test context with it.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
# Flyway is prod-only (migrations target Postgres and run before Hibernate's
# create-drop schema exists). This file shadows the main application.properties
# on the test classpath, so the opt-out must be repeated here.
spring.flyway.enabled=false
spring.datasource.driver-class-name=org.h2.Driver
# Keep pooled connections forever, as the dev profile does and for the same
# reason: H2 checks the enum constraints of a table through the session that
# created them, so retiring the DDL connection breaks every insert. A test JVM
# outliving the 30 min Hikari default would fail one insert-side test with a
# CONSTRAINT_x message that reads like a schema bug.
spring.datasource.hikari.max-lifetime=0
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
# Auth0 OIDC Configuration (Test - mocked JwtDecoder, no real issuer)
spring.security.oauth2.resourceserver.jwt.audiences=https://api.trivlu.com
app.auth.roles-claim=https://trivlu.com/roles
# Allow test beans to override production beans (e.g. JwtDecoder)
spring.main.allow-bean-definition-overriding=true
# Cloudflare Turnstile (test)
turnstile.secret-key=test-secret
turnstile.verify-url=http://localhost:0/not-used
# Email (disabled in tests)
app.email.enabled=false
app.email.from=test@test.com
app.email.contact-to=test@test.com
app.email.bookings-to=booking@test.com
app.email.template.cache=false
spring.mail.host=localhost
spring.mail.port=25
# Upload
app.upload.max-file-size=10485760
# Disable mail health check
management.health.mail.enabled=false

# R2 is never configured for tests: pin the endpoint empty so an exported R2_ENDPOINT on a dev
# machine cannot switch ImageUploadService on and change CSV-import preview outcomes.
r2.endpoint=
# AI planner: enabled in tests; model calls go through FakeLlmGateway, never the real endpoint
app.ai.enabled=true
app.ai.turnstile-required=false
# Spring AI OpenAI starter needs a non-blank credential to build its client beans at context
# startup, even though no test calls Qwen. The base-url is pinned to an unroutable local
# address so a stray real call fails fast instead of reaching DashScope or OpenAI.
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:0/not-used
