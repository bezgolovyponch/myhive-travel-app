spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
# JWT Configuration
jwt.secret=test-secret-key-that-is-at-least-32-bytes-long
jwt.expiration=86400000
# Admin Credentials
app.admin.email=admin@test.com
app.admin.password=testpassword123
# Email (disabled in tests)
app.email.enabled=false
app.email.from=test@test.com
app.email.template.cache=false
spring.mail.host=localhost
spring.mail.port=25
# Upload
app.upload.max-file-size=10485760
# Disable mail health check
management.health.mail.enabled=false
