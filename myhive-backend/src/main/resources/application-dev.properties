spring.application.name=myhive-backend
# H2 In-Memory Database Configuration (for local development)
spring.datasource.url=jdbc:h2:mem:devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Never retire a pooled connection (0 = infinite lifetime). H2 evaluates a
# table's check constraints — the "status in ('ACTIVE','COMPLETED')" ones
# Hibernate generates for every enum column — through the session that CREATED
# them, which here is the connection that ran the startup DDL. Once Hikari
# retires it (default maxLifetime 30 min), every INSERT into vote_sessions,
# trip_leads, bookings or booking_payment_shares fails with
# "Check constraint invalid: CONSTRAINT_x" wrapping "The database has been
# closed", while reads keep working — i.e. the app silently stops accepting
# votes after half an hour of uptime. Dev-only workaround for H2 2.4.240;
# retest on the next H2 bump. Prod is PostgreSQL, which evaluates its own
# constraints.
spring.datasource.hikari.max-lifetime=0
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Enable data initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Server Configuration
server.port=8080
# Logging (development)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.myhive.backend=DEBUG
# Email Configuration (Development - disabled by default)
app.email.enabled=${EMAIL_ENABLED:false}
# Frontend base URL used to build links in emails — localhost in dev so a
# locally created vote session yields a link that resolves against the local app.
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
spring.mail.properties.mail.debug=true
# Email Template Caching (disabled in dev for hot reload)
app.email.template.cache=false
# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=false
management.health.db.enabled=true
# Rate Limiting (relaxed in dev — StrictMode doubles requests)
app.rate-limit.max-requests=10000
# Cloudflare Turnstile (test key - always passes)
turnstile.secret-key=1x0000000000000000000000000000000AA
# Auth0 OIDC Configuration (Development)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-vuovenjc10axdu0l.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://api.trivlu.com
app.auth.roles-claim=https://trivlu.com/roles
