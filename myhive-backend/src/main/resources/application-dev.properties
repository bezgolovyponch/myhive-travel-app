spring.application.name=myhive-backend
# H2 In-Memory Database Configuration (for local development)
spring.datasource.url=jdbc:h2:mem:devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Enable data initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Server Configuration
server.port=8080
# Logging (development)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.myhive.backend=DEBUG
# Email Configuration (Development - disabled by default)
app.email.enabled=${EMAIL_ENABLED:false}
spring.mail.properties.mail.debug=true
# Email Template Caching (disabled in dev for hot reload)
app.email.template.cache=false
# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=false
management.health.db.enabled=true
# Auth0 OIDC Configuration (Development)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-vuovenjc10axdu0l.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://api.trivlu.com
app.auth.roles-claim=https://trivlu.com/roles
