spring.application.name=myhive-backend
# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/myhive_db}
spring.datasource.username=${DB_USERNAME:myhive_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Enable data initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
# Server Configuration (Render provides PORT environment variable)
server.port=${PORT}
server.servlet.context-path=/api
# Logging (production)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=WARN
logging.level.com.myhive.backend=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# Email Configuration (Production - enable via env var)
app.email.enabled=${EMAIL_ENABLED:true}
# Disable mail health check
management.health.mail.enabled=false
# Auth0 OIDC Configuration (Production)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}
app.auth.roles-claim=${AUTH0_ROLES_CLAIM:https://trivlu.com/roles}
