spring.application.name=myhive-backend
# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/myhive_db}
spring.datasource.username=${DB_USERNAME:myhive_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Enable data initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
# Server Configuration (Render provides PORT environment variable)
server.port=${PORT}
server.servlet.context-path=/api
# Logging (production)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=WARN
logging.level.com.myhive.backend=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# Google Sheets Configuration (bean only created in prod profile)
google.sheets.enabled=${GOOGLE_SHEETS_ENABLED:false}
google.sheets.credentials-json=${GOOGLE_SHEETS_CREDENTIALS_JSON:}
google.sheets.credentials-path=${GOOGLE_SHEETS_CREDENTIALS_PATH:}
google.sheets.spreadsheet-id=${GOOGLE_SHEETS_SPREADSHEET_ID:}
google.sheets.application-name=MyHive Travel App
# Email Configuration (Production)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Email Configuration
app.email.enabled=false
# Disable mail health check
management.health.mail.enabled=false
# JWT Configuration
jwt.secret=${JWT_SECRET:myhive-super-secret-jwt-key-2024}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Admin Credentials
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
