# -----------------------------------------------------------------------------------------------
# proddb: the PRODUCTION database from a developer machine, for debugging against real data.
#
# Always stacked on top of prod, in this order:   SPRING_PROFILES_ACTIVE=prod,proddb
# prod supplies the Postgres datasource (DATABASE_URL / DB_USERNAME / DB_PASSWORD) and the
# @Profile("prod") beans (the planner's Postgres checkpoint saver, so AI sessions stay resumable);
# this overlay switches off everything a second process on that database must not do and restores
# the local-development ergonomics (port 8080 at the root, debug logging).
# Credentials live in .env.proddb (template: .env.proddb.example):
#     ./gradlew bootRun -Penv=proddb
#
# Nothing here makes the connection read-only: every write the UI makes lands on prod, and with email
# off, any action that would mail a customer completes WITHOUT the mail - prod never sends it either,
# the row already says done. Unsafe from here: closing a vote (result email), starting one (creation
# email), a booking (confirmation), the contact form, a deposit. Reproduce those on the dev profile;
# use this one to read real data. AI sessions opened from here checkpoint into prod's lg4j tables in
# THIS branch's state shape (the prod-profile Postgres saver is kept so a session stuck on prod can be
# resumed here): on a branch that changed PlannerState or Brief, those rows are prod's to choke on.
# -----------------------------------------------------------------------------------------------

# --- never, from a laptop -----------------------------------------------------------------------
# No outbound email: customers must not get mail from a debugging session. A literal, not
# ${EMAIL_ENABLED}: a stray value in the env file must not be able to switch it on.
app.email.enabled=false
# No scheduled jobs: VoteSessionScheduler would close expiring votes with the result email skipped
# by the line above (prod then finds them closed and never sends it), PlanGenerationService would
# fail prod's QUEUED generations as orphans of "a previous process", the nightly crons would delete
# rows. See SchedulingConfig. Prod keeps ticking over rows written from here, though: its
# failStaleRunning sweep fails any RUNNING generation older than STALE_AFTER_MINUTES (3) that its own
# process does not own, so a planner run started from this machine must finish inside that window.
app.scheduling.enabled=false
# No startup repair either: LegacyBookingDataRepair UPDATEs legacy booking rows on every start. Idempotent
# on prod today, but a branch whose repair is ahead of prod would run it on prod from a laptop.
app.startup-repairs.enabled=false
# The schema is read, never written. Flyway stays off so a feature branch's pending migration cannot
# run on prod from a laptop; prod's own ddl-auto=validate (carried over, not restated here) then fails
# startup when the branch's entities are ahead of the schema - that branch needs a deploy, not a local
# run. prod's spring.sql.init.mode=never carries over the same way: no data.sql on this datasource.
spring.flyway.enabled=false

# --- local ergonomics ---------------------------------------------------------------------------
# Root path on 8080, like dev: myhive-next's BACKEND_URL=http://localhost:8080 keeps working as is.
server.port=8080
server.servlet.context-path=
# prod's default points at trivlu.com; Stripe return URLs and the links built into (unsent) emails go
# to the local frontend instead.
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
# The tenant prod uses, so a local admin login (the Next .env.local authority) yields a JWT this
# backend accepts. Still env-overridable, as in prod.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-vuovenjc10axdu0l.eu.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://api.trivlu.com}
# Cloudflare's always-passing test secret; the local frontend ships the matching test site key.
turnstile.secret-key=1x0000000000000000000000000000000AA
# Debugging is the point. Bound parameters stay off on purpose: BasicBinder at TRACE would print
# customer data to the console.
logging.level.com.myhive.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n%wEx
