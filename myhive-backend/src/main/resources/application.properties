spring.application.name=myhive-backend
# Active profile (set via SPRING_PROFILES_ACTIVE environment variable)
# Default to development if not specified
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Flyway is opt-in per profile: prod enables it; dev/tests let Hibernate
# create the schema from the entities (create-drop / H2).
spring.flyway.enabled=false
# Cloudflare R2 Configuration
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}
r2.public-url=${R2_PUBLIC_URL:}
# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.max-file-size=10485760
# Resend SMTP Configuration
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
# Bound the blocking SMTP send so a slow/unreachable Resend cannot hang the email pool threads
# indefinitely (which would back up the queue and, via CallerRunsPolicy, block request threads).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=10000
# Email Configuration
app.email.from=${EMAIL_FROM:noreply@trivlu.com}
app.email.contact-to=${EMAIL_CONTACT_TO:info@trivlu.com}
app.email.bookings-to=${EMAIL_BOOKINGS_TO:booking@trivlu.com}
app.email.enabled=${EMAIL_ENABLED:false}
# Daily "new contacts" digest to app.email.bookings-to (07:00 UTC). Kill switch; capture keeps running when off.
app.contacts.digest-enabled=${CONTACTS_DIGEST_ENABLED:true}
# Public base URL of this API (for RFC 8058 List-Unsubscribe headers); empty = headers omitted
app.api.public-url=${API_PUBLIC_URL:}
# Trip lead reminder emails (abandoned-trip series) — kill switch
app.leads.reminders-enabled=${REMINDERS_ENABLED:true}
# Organizer progress emails during a vote (halfway + 12h reminder) — kill switch
app.vote.organizer-emails-enabled=${VOTE_ORGANIZER_EMAILS_ENABLED:true}
# Cloudflare Turnstile
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
# Auth0 OIDC Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://api.trivlu.com}
app.auth.roles-claim=${AUTH0_ROLES_CLAIM:https://trivlu.com/roles}
# Frontend URL (for sitemap generation and payment return URLs)
app.frontend.url=${FRONTEND_URL:https://trivlu.com}
# Stripe Payments
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.currency=${STRIPE_CURRENCY:eur}
app.payment.deposit-pct=${PAYMENT_DEPOSIT_PCT:30}
# AI stag-party planner (Qwen via DashScope OpenAI-compatible endpoint, orchestrated by langgraph4j)
app.ai.enabled=${AI_ENABLED:false}
app.ai.chat-model=${QWEN_CHAT_MODEL:qwen3.7-plus}
app.ai.planner-model=${QWEN_PLANNER_MODEL:qwen3.8-max}
app.ai.chat-timeout=${AI_CHAT_TIMEOUT:20s}
app.ai.planner-timeout=${AI_PLANNER_TIMEOUT:60s}
app.ai.turnstile-required=${AI_TURNSTILE_REQUIRED:false}
app.ai.session-ttl-days=30
app.ai.daily-sessions-per-ip=20
# Spring AI OpenAI client pointed at DashScope. A blank key fails ApplicationContext startup
# (the OpenAI client rejects an empty credential), so the placeholder default is 'unset';
# that is fine while app.ai.enabled=false because no call is ever made.
spring.ai.openai.api-key=${QWEN_API_KEY:unset}
spring.ai.openai.base-url=${QWEN_BASE_URL:https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
# Only a fallback: SpringAiLlmGateway sets the model per call (chat vs planner).
spring.ai.openai.chat.model=${QWEN_CHAT_MODEL:qwen3.7-plus}
# Transport ceiling; the per-call budgets in app.ai.*-timeout are always shorter.
spring.ai.openai.timeout=90s
spring.ai.openai.max-retries=1
# Embeddings/images/audio autoconfig are not used; keep them off so no extra beans are created
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

