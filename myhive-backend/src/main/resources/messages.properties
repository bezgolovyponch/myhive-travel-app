# Customer-facing email copy (English, default locale). Translations live in messages_<locale>.properties.
# Keys: email.<template>.<section>.<name>; templates: itinerary, voteCreated, voteResult, paymentReceived, tripReminder.
# Values with {n} parameters go through java.text.MessageFormat: double any literal apostrophe ('') and quote literal braces.

