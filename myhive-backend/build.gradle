plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.myhive'
version = '0.0.1-SNAPSHOT'
description = 'myhive-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Stripe payments (deposit Checkout + webhook)
    implementation 'com.stripe:stripe-java:32.2.0'

    // Cloudflare R2 (S3-compatible) image uploads
    implementation platform('software.amazon.awssdk:bom:2.31.8')
    implementation 'software.amazon.awssdk:s3'

    // Image downscaling/recompression before upload (2MB originals -> ~150KB web JPEGs)
    implementation 'net.coobird:thumbnailator:0.4.20'

    // CSV parsing for activities import/export
    implementation 'com.opencsv:opencsv:5.11'

    // Slug generation (with ICU4J for full transliteration: Cyrillic, CJK, ß, etc.)
    implementation 'com.github.slugify:slugify:3.0.7'
    implementation 'com.ibm.icu:icu4j:76.1'

    // Flyway schema migrations (runs at startup before Hibernate; ddl-auto=update
    // cannot relax constraints, so real DDL changes ship as versioned migrations).
    // Spring Boot 4 moved FlywayAutoConfiguration out of spring-boot-autoconfigure
    // into the spring-boot-flyway module — without it, flyway-core sits inert on the
    // classpath and spring.flyway.* properties are silently ignored.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Security & OAuth2 Resource Server (Auth0 OIDC)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // H2 Database for testing
    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            line = line.trim()
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                environment key.trim(), value.trim()
            }
        }
    }
}
