plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.myhive'
version = '0.0.1-SNAPSHOT'
description = 'myhive-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Stripe payments (deposit Checkout + webhook)
    implementation 'com.stripe:stripe-java:32.2.0'

    // Cloudflare R2 (S3-compatible) image uploads
    implementation platform('software.amazon.awssdk:bom:2.31.8')
    implementation 'software.amazon.awssdk:s3'

    // Image downscaling/recompression before upload (2MB originals -> ~150KB web JPEGs)
    implementation 'net.coobird:thumbnailator:0.4.20'

    // CSV parsing for activities import/export
    implementation 'com.opencsv:opencsv:5.11'

    // Slug generation (with ICU4J for full transliteration: Cyrillic, CJK, ß, etc.)
    implementation 'com.github.slugify:slugify:3.0.7'
    implementation 'com.ibm.icu:icu4j:76.1'

    // Flyway schema migrations (runs at startup before Hibernate; ddl-auto=update
    // cannot relax constraints, so real DDL changes ship as versioned migrations).
    // Spring Boot 4 moved FlywayAutoConfiguration out of spring-boot-autoconfigure
    // into the spring-boot-flyway module — without it, flyway-core sits inert on the
    // classpath and spring.flyway.* properties are silently ignored.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Security & OAuth2 Resource Server (Auth0 OIDC)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // H2 Database for testing
    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // Spring AI 2.0 (Boot 4 line): OpenAI-compatible client pointed at DashScope (Qwen)
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // langgraph4j: checkpointed, interruptible state graph for the AI planner.
    // Only core + postgres-saver are used; langgraph4j-spring-ai is built against Spring AI 2.0.0-M4 and is deliberately NOT used.
    def langgraph4jBom = 'org.bsc.langgraph4j:langgraph4j-bom:1.8.13'
    implementation platform(langgraph4jBom)
    implementation 'org.bsc.langgraph4j:langgraph4j-core'
    implementation 'org.bsc.langgraph4j:langgraph4j-postgres-saver'
    // Visual graph debugger, dev profile only (see PlannerStudioConfig), split across two jars on
    // purpose. `langgraph4j-studio` (~64 KB, servlets + Instance types) has to be `implementation`:
    // Gradle keeps developmentOnly off compileClasspath, so PlannerStudioConfig could not reference
    // those types otherwise. `langgraph4j-studio-springboot` is the same servlets plus a 30 MB
    // static/ web UI, and that stays `developmentOnly` - a jar entry under static/ is served by
    // Spring Boot from the classpath root, so on `implementation` the prod image would both carry
    // and publish the Studio front end. PlannerStudioConfig is @ConditionalOnClass on this jar, so
    // it wires itself only where the UI is actually present, i.e. bootRun.
    implementation 'org.bsc.langgraph4j:langgraph4j-studio'
    // The BOM has to be repeated: developmentOnly extends nothing, so the version the implementation
    // platform pins never reaches it and bootJar fails resolving the module with no version at all.
    developmentOnly platform(langgraph4jBom)
    developmentOnly 'org.bsc.langgraph4j:langgraph4j-studio-springboot'

    // Testcontainers Postgres for the checkpoint-persistence test (@Tag("docker")).
    // Testcontainers 2.x (pinned by the Spring Boot 4 BOM) renamed these modules from
    // org.testcontainers:junit-jupiter / :postgresql to the testcontainers-* prefixed
    // artifacts below; the old unprefixed names no longer resolve a managed version.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    // -Penv=proddb loads .env.proddb instead of .env (the prod database from this machine, see
    // application-proddb.properties); without it bootRun loads the H2 dev setup in .env, if present.
    // The suffix rather than the file name on purpose: Windows PowerShell splits "-PenvFile=.env.proddb"
    // at the dot and Gradle then looks for a task called ".env.proddb".
    def envName = project.findProperty('env')
    def envFile = file(envName ? ".env.${envName}" : '.env')
    // Checked and read when bootRun actually runs: a missing file or a profile override must stop the
    // app from starting, not an IDE sync or `gradle tasks` that merely realizes the task.
    doFirst {
        if (envName && !envFile.exists()) {
            // A typo would otherwise boot the H2 dev seed under the impression of real data.
            throw new GradleException("env file not found: ${envFile}")
        }
        if (envName && (args + jvmArgs).any { it.contains('spring.profiles.active') }) {
            // The documented dev command carries --args='--spring.profiles.active=dev'; pasted next to
            // -Penv it would boot H2 with the prod database password and R2 keys exported into the process,
            // since a command-line argument (or a -D system property) outranks the SPRING_PROFILES_ACTIVE
            // the env file sets.
            throw new GradleException("-Penv=${envName} takes the profiles from ${envFile.name}; "
                    + "drop spring.profiles.active from --args and jvmArgs")
        }
        def values = [:]
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                line = line.trim()
                if (line && !line.startsWith('#') && line.contains('=')) {
                    def (key, value) = line.split('=', 2)
                    values[key.trim()] = value.trim()
                }
            }
        }
        if (envName && !(values['SPRING_PROFILES_ACTIVE'] ?: '').contains(envName)) {
            // .env.<name> is the file that activates the <name> profile. A copy of the dev .env with the
            // prod credentials added, SPRING_PROFILES_ACTIVE=dev still in it, would boot the H2 seed with
            // the prod keys exported and read as real data.
            throw new GradleException("${envFile.name} must set SPRING_PROFILES_ACTIVE to include '${envName}'")
        }
        values.each { key, value -> environment key, value }
    }
}
